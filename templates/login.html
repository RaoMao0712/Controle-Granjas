{% extends "base.html" %}

{% block conteudo %}
<div class="card login-card">
    <h2>Bem-vindo ao GranjaPro</h2>

    <form method="POST">
        <label>E-mail</label>
        <input type="email" name="email" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <button type="submit">Entrar</button>
    </form>

    <div class="plano">
        Plano profissional: <strong>R$ 39,90/mês</strong>
    </div>

    <p class="obs">
        Acesso exclusivo para clientes cadastrados.
    </p>
</div>
{% endblock %}
