{% extends "base.html" %}

{% block conteudo %}
<div class="card">
    <h2>Editar lançamento</h2>

    <form method="POST">

        <div class="form-grid">

            <div>
                <label>Lote</label>
                <input type="text" name="lote" value="{{ lancamento.lote }}" required>
            </div>

            <div>
                <label>Aves no início</label>
                <input type="number" name="aves" value="{{ lancamento.aves }}" required>
            </div>

            <div>
                <label>Entradas</label>
                <input type="number" name="entradas" value="{{ lancamento.entradas }}" required>
            </div>

            <div>
                <label>Saídas / ajustes</label>
                <input type="number" name="saidas" value="{{ lancamento.saidas }}" required>
            </div>

            <div>
                <label>Ovos produzidos</label>
                <input type="number" name="ovos" value="{{ lancamento.ovos }}" required>
            </div>

            <div>
                <label>Mortes</label>
                <input type="number" name="mortes" value="{{ lancamento.mortes }}" required>
            </div>

            <div>
                <label>Ração consumida (kg)</label>
                <input type="number" step="0.01" name="racao" value="{{ lancamento.racao }}" required>
            </div>

        </div>

        <label>Justificativa obrigatória</label>
        <textarea
            name="justificativa"
            rows="4"
            required
            placeholder="Explique o motivo do ajuste..."
        ></textarea>

        <button type="submit">
            Salvar ajuste
        </button>
    </form>
</div>
{% endblock %}
